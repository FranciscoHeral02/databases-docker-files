version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ya no exponemos el 5432 directamente, se comunica por la red interna
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-internal
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    environment:
      # Configuración de conexión a la DB real
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      # Configuración del Pool
      - POOL_MODE=transaction  # Recomendado para microservicios
      - MAX_CLIENT_CONN=1000   # Soporta hasta 1000 microservicios conectados
      - DEFAULT_POOL_SIZE=20   # Conexiones reales mantenidas hacia Postgres
      - ADMIN_USERS=${POSTGRES_USER}
      - AUTH_TYPE=any          # En desarrollo; para prod usa auth_file
    ports:
      # Conecta pgAdmin o tus microservicios a este puerto (6432)
      - "127.0.0.1:6432:6432"
    networks:
      - db-internal
    depends_on:
      db:
        condition: service_healthy

networks:
  db-internal:
    driver: bridge

volumes:
  postgres_data:
