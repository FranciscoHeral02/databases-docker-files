name: Continuous Deployment

on:
  push:
    branches: [ master ]  # Se dispara cuando haces push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Ejecutar comandos vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd /home/${{ secrets.SSH_USER }}/db-deployment  # Ajusta esta ruta a tu carpeta real
            
            # 2. Actualizar el código
            git pull origin main
            
            # 3. Crear el archivo .env actualizado al vuelo
            echo "POSTGRES_USER=${{ secrets.DB_USER }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.DB_NAME }}" >> .env
            
            # 4. Levantar los servicios
            docker compose up -d --build
            
            # 5. Limpieza opcional de imágenes huérfanas
            docker image prune -f
